<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>:target 选中下划线菜单</title>
<style>
ul.menu {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    background: #f5f5f5;
}

ul.menu li a {
    display: block;
    padding: 10px 20px;
    text-decoration: none;
    color: #333;
    transition: all 0.2s ease;
}

/* 悬停效果 */
ul.menu li a:hover {
    background: #e0e0e0;
}

/* 选中状态 */
ul.menu li a:target {
    border-bottom: 3px solid #007BFF;
    font-weight: bold;
}
</style>
</head>
<body>

<ul class="menu">
    <li><a href="./nav_target.html" id="home">首页</a></li>
    <li><a href="./nav_target2.html" id="products">产品</a></li>
    <li><a href="#services" id="services">服务</a></li>
    <li><a href="#contact" id="contact">联系我们</a></li>
</ul>

</body>
</html>
