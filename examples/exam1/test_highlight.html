<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <style>
        #navbar {
            width: 100%;
            height: 60px;
            background-color: #3667AB;
        }

        /*  可不要  */
        #com_headtop {
            color: #000;
        }

        #com_headtop>li {
            float: left;
            width: 150px;
            height: 60px;
            line-height: 60px;
            text-align: center;
            color: #fff;
            cursor: pointer;
        }

        #com_headtop li a:focus-visible {
            background-color: #FF9148;
            outline-style: none;
        }

        #com_headtop>li a {
            display: block;
            width: 100%;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <!-- 注意：实现此功能，必须要给每个li添加tabindex='1'属性 -->
    <header id='navbar'>
        <ul id='com_headtop' class="clearfix main">
            <li tabindex="1"><a href="" tabindex="1">首页</a></li>
            <li tabindex="1"><a href="" tabindex="1">贷款</a></li>
            <li tabindex="1"><a>信用卡</a></li>
            <li tabindex="1"><a>大数据信用</a></li>
            <li tabindex="1"><a>资讯</a></li>
        </ul>
    </header>

    贷款
</body>

</html>
